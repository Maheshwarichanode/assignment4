<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion UI</title>

    <link rel="stylesheet" href="high.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- Navbar -->

        <nav>
            <h1>Deep'style</h1>

            <ul>
                <li>New Arrivals</li>
                <li>Shop</li>
                <li>Beauty</li>
                <li>Sale</li>
                <li>Journal</li>
            </ul>

            <div class="icons">
                <span>🔍</span>
                <span>🛒</span>
            </div>
        </nav>

        <hr>

        <!-- Hero Section -->

        <div class="hero">

            <!-- Left Text -->

            <div class="left-text">
                <p>Summer Collection</p>

                <h3>
                    TRANDY AND <br>
                    CLUSSI FOR <br>
                    NEW SEASON
                </h3>
            </div>

            <!-- Main Content -->

            <div class="main-content">

                <h1>
                    Make Your Fashion Look <br>
                    More Charming
                </h1>

                <!-- Image Grid -->

                <div class="grid">

                    <div class="box box1">
                        <img src="boy1.jpg">
                    </div>

                    <div class="box box2">
                        <img src="boy2.jpg">
                    </div>

                    <div class="box box3">
                        <img src="boy3.jpg">
                    </div>

                    <div class="box box4">
                        <img src="boy4.jpg">
                    </div>

                    <div class="box box5">
                        <img src="boy5.jpg">
                    </div>

                    <div class="box box6">
                        <img src="boy6.jpg">
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
