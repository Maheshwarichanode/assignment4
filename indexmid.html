
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio UI</title>

  <link rel="stylesheet" href="stylemid.css">
</head>
<body>

  <div class="container">

    <div class="sidebar">
      <span>Clients</span>
      <span>Research</span>
      <span>Portfolio</span>
      <span>Podcast</span>
    </div>

    <div class="profile-card">

      <div class="top-text">
        ✣ About Me
      </div>

      <div class="circle"></div>

      <img
      src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=600&auto=format&fit=crop"
      alt="">

      <div class="profile-content">
        <h3>Im,</h3>

        <h1>
          Jon <br>
          Daniel
        </h1>

        <p>inquiry@jondaniel.design</p>
      </div>

      <div class="badge">
        UI DESIGN
      </div>

    </div>

    <div class="right-section">

      <h1 class="title">
        Portfolio
      </h1>

      <!-- TOP GRID -->
      <div class="top-grid">

        <div class="flamingo-card">

          <img
          src="https://images.unsplash.com/photo-1497206365907-f5e630693df0?q=80&w=1200&auto=format&fit=crop"
          alt="">

          <div class="play-btn">
            ▶
          </div>

        </div>

        <div class="stats">

          <div class="box mint">
            <h2>251</h2>
            <p>Projects</p>
          </div>

          <div class="box purple">
            <h2>156</h2>
            <p>Awards</p>
          </div>

        </div>

      </div>

      <!-- BOTTOM GRID -->
      <div class="bottom-grid">

        <div class="small-card gray">
          <h2></h2>
          <p>Clients</p>
        </div>

        <div class="small-card black">
          <div class="ball"></div>
        </div>

        <div class="small-card yellow">
          <h2>172</h2>
          <p>Global Design Awards.</p>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
